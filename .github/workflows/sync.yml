name: Scheduled Sync

# Keep in sync with lib/sync-schedule.ts (SYNC_INTERVAL_MINUTES).
on:
  schedule:
    - cron: '*/20 * * * *'
  workflow_dispatch: {}

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger database sync
        run: |
          status=$(curl -s -o response.json -w "%{http_code}" -X POST \
            -H "Authorization: Bearer ${{ secrets.SYNC_SECRET }}" \
            https://ns-msp-kpis-dashboard.vercel.app/api/sync)
          echo "HTTP status: $status"
          cat response.json
          if [ "$status" -ge 400 ]; then
            echo "::error::Sync request failed with HTTP $status"
            exit 1
          fi
